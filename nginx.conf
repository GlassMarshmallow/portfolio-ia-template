server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # No mostrar la versión de nginx
  server_tokens off;

  # Cabeceras de seguridad básicas
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Archivos con hash en el nombre (JS/CSS de Angular): se pueden guardar en caché mucho tiempo
  location ~* \.(?:js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Imágenes y fuentes
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # API de preguntas: se pasa al contenedor "api". La dirección se resuelve en cada petición
  # (resolver de Docker), así nginx arranca aunque la API aún no esté lista.
  location /api/ {
    resolver 127.0.0.11 valid=30s;
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # La respuesta llega por trozos según la genera la IA: se envía tal cual, sin acumularla
    proxy_buffering off;
    proxy_read_timeout 180s;
    client_max_body_size 64k;
  }

  # La página siempre fresca, para que los cambios se vean al momento
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
  }
}
