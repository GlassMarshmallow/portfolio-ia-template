# Ollama (la IA) en Docker, en el mismo servidor que el portfolio. Arráncalo antes que el portfolio:
#   docker compose -f deploy/ollama/compose.yaml up -d
#   docker exec ollama-ollama-1 ollama pull qwen3:8b      (o el modelo que elijas, ver README)
# No se publica a internet: solo escucha en 127.0.0.1 (para pruebas desde el propio servidor) y en la red de
# Docker "ollama-compartido", a la que se une la API del portfolio (http://ollama:11434). Otros proyectos
# tuyos pueden usar la misma IA uniéndose a esa red.
name: ollama

services:
  ollama:
    image: ollama/ollama:0.40.5
    restart: unless-stopped
    environment:
      # Un solo modelo cargado y una respuesta a la vez: deja memoria libre para el resto del servidor
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      # Si nadie pregunta en 10 minutos, descarga el modelo y libera la memoria
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - modelos:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - compartida
    # Límite de memoria: qwen3:8b ocupa unos 6 GB (ajústalo si usas otro modelo)
    mem_limit: 8g

volumes:
  modelos:

networks:
  compartida:
    name: ollama-compartido
