# Portfolio + API del chat + (opcional) Ollama + túnel de Cloudflare.
name: portfolio

# El portfolio no publica ningún puerto a internet: solo el túnel de Cloudflare llega a él por la
# red interna de Docker. En el propio servidor se puede abrir en http://localhost:8095 para comprobarlo.
services:
  portfolio:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:80"

  # API del chat y del formulario inteligente. nginx del portfolio le pasa las llamadas a /api/.
  # La IA se elige en el .env (IA_PROVEEDOR): sin elegir, el chat avisa de que no está conectada.
  api:
    build: ./api
    restart: unless-stopped
    environment:
      IA__Proveedor: ${IA_PROVEEDOR:-}
      Ollama__BaseUrl: ${OLLAMA_URL:-http://ollama:11434/}
      Ollama__Model: ${OLLAMA_MODEL:-qwen3:8b}
      OpenAI__BaseUrl: ${OPENAI_URL:-https://api.openai.com/v1/}
      OpenAI__Model: ${OPENAI_MODEL:-gpt-4o-mini}
      # Claves (en el .env del servidor, nunca en git)
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__ChatId: ${TELEGRAM_CHAT_ID:-}
      Solicitudes__Carpeta: /data/solicitudes
    volumes:
      # Copia de cada solicitud recibida, por si falla Telegram
      - solicitudes:/data/solicitudes
    mem_limit: 256m

  # Ollama (la IA en tu propio servidor). Solo se arranca si usas IA_PROVEEDOR=ollama:
  #   docker compose --profile ollama up -d --build
  #   docker compose exec ollama ollama pull qwen3:8b      (o el modelo que elijas, ver README)
  # No se publica a internet: la API llega a él por la red interna (http://ollama:11434).
  ollama:
    image: ollama/ollama:0.40.5
    profiles: ["ollama"]
    restart: unless-stopped
    environment:
      # Un solo modelo cargado y una respuesta a la vez: deja memoria libre para el resto del servidor
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      # Si nadie pregunta en 10 minutos, descarga el modelo y libera la memoria
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - modelos:/root/.ollama
    # Límite de memoria: qwen3:8b ocupa unos 6 GB (ajústalo si usas otro modelo)
    mem_limit: 8g

  # Túnel con dominio propio (URL fija). Necesita CLOUDFLARE_TUNNEL_TOKEN en el archivo .env.
  # Arranque: añade --profile tunel (p. ej. docker compose --profile tunel up -d --build)
  cloudflared:
    image: cloudflare/cloudflared:2025.9.1
    profiles: ["tunel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - portfolio

  # Túnel rápido sin cuenta ni dominio: da una URL *.trycloudflare.com aleatoria que cambia en cada
  # reinicio. Útil para probar. Arranque: añade --profile rapido
  # y la URL aparece en: docker compose logs cloudflared-rapido
  cloudflared-rapido:
    image: cloudflare/cloudflared:2025.9.1
    profiles: ["rapido"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://portfolio:80
    depends_on:
      - portfolio

volumes:
  solicitudes:
  modelos:
