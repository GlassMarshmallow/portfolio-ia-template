<!-- Fondo de GlassMarshmallow (luces y puntos, sin efecto de televisor) con, encima de las luces, el dibujo
     animado si lo hay (src/app/core/data/hero.data.ts). Decorativo: la descripción del dibujo está en el inicio. -->
<div class="gm-backdrop" [class.has-scene]="hasScene" aria-hidden="true">
  <div class="gm-backdrop__dots"></div>
  @if (hasScene) {
    <canvas #scene class="scene-bg"></canvas>
    <canvas #glow class="scene-bg crt-glow"></canvas>
  }
  <!-- Al bajar por el inicio, el fondo se oscurece (se aclara de día) para que se lean las secciones -->
  <div class="scene-dim" [style.opacity]="dim()"></div>
  <div class="gm-backdrop__vignette"></div>
</div>
