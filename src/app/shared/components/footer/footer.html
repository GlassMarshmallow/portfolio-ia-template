<footer class="gm-footer" id="contacto">
  <div class="gm-container">
    <h2>Conectemos</h2>

    <div class="gm-footer__socials">
      <a [href]="'mailto:' + profile.email" [attr.aria-label]="'Enviar un correo a ' + profile.email">
        <i class="gmi gmi-envelope-fill" aria-hidden="true"></i>
      </a>
      <a [href]="githubUrl" aria-label="GitHub (se abre en una pestaña nueva)" target="_blank" rel="noopener">
        <i class="gmi gmi-github" aria-hidden="true"></i>
      </a>
      <a [href]="linkedinUrl" aria-label="LinkedIn (se abre en una pestaña nueva)" target="_blank" rel="noopener">
        <i class="gmi gmi-linkedin" aria-hidden="true"></i>
      </a>
    </div>

    <nav class="gm-footer__links" aria-label="Información legal">
      <button type="button" (click)="aiInfo.open()">Información sobre la IA</button>
      <span aria-hidden="true">·</span>
      <a routerLink="/privacidad">Privacidad</a>
      <span aria-hidden="true">·</span>
      <a routerLink="/aviso-legal">Aviso legal</a>
    </nav>

    <p class="gm-footer__bottom">{{ year }} · <strong>{{ profile.fullName }}</strong> · Portfolio</p>
    <!-- Créditos de la plantilla: se agradece mantenerlos (ver README → Licencia) -->
    <p class="gm-footer__credit">
      Hecho con
      <a href="https://github.com/spyamuza/portfolio-ia-template" target="_blank" rel="noopener"
         aria-label="portfolio-ia-template (se abre en una pestaña nueva)">portfolio-ia-template</a>
      y <a href="https://github.com/spyamuza/glassmarshmallow" target="_blank" rel="noopener"
         aria-label="GlassMarshmallow (se abre en una pestaña nueva)">GlassMarshmallow</a>
      · Licencia
      <a href="https://polyformproject.org/licenses/noncommercial/1.0.0/" target="_blank" rel="noopener"
         aria-label="PolyForm Noncommercial (se abre en una pestaña nueva)">PolyForm Noncommercial</a>
    </p>
  </div>
</footer>
