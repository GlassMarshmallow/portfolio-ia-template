<footer class="footer container-fluid py-5">
  <div class="container">

    <!-- FILA SUPERIOR -->
    <div class="row justify-content-center text-center mb-4">
      <div class="col-12">
        <h3>Conectemos</h3>
      </div>

      <div class="col-12 d-flex justify-content-center gap-4 socials mt-3">
        <a [href]="'mailto:' + profile.email" [attr.aria-label]="'Enviar un correo a ' + profile.email">
          <app-icon name="envelope" />
        </a>

        <a [href]="githubUrl" aria-label="GitHub (se abre en una pestaña nueva)" target="_blank" rel="noopener">
          <app-icon name="github" />
        </a>

        <a [href]="linkedinUrl" aria-label="LinkedIn (se abre en una pestaña nueva)" target="_blank" rel="noopener">
          <app-icon name="linkedin" />
        </a>
      </div>
    </div>

    <!-- ENLACES LEGALES -->
    <nav class="legal-links" aria-label="Información legal">
      <button type="button" class="legal-link" (click)="aiInfo.open()">Información sobre la IA</button>
      <span aria-hidden="true">·</span>
      <a class="legal-link" routerLink="/privacidad">Privacidad</a>
      <span aria-hidden="true">·</span>
      <a class="legal-link" routerLink="/aviso-legal">Aviso legal</a>
    </nav>

    <!-- FILA INFERIOR -->
    <div class="row">
      <div class="col-12 text-center mt-4 bottom">
        <p>{{ year }} · <span class="brand">{{ profile.fullName }}</span> · Portfolio</p>
        <!-- Créditos de la plantilla: se agradece mantenerlos (ver README → Licencia) -->
        <p class="template-credit">
          Hecho con
          <a class="legal-link" href="https://github.com/spyamuza/portfolio-ia-template" target="_blank" rel="noopener"
             aria-label="portfolio-ia-template (se abre en una pestaña nueva)">portfolio-ia-template</a>
          · Licencia
          <a class="legal-link" href="https://polyformproject.org/licenses/noncommercial/1.0.0/" target="_blank" rel="noopener"
             aria-label="PolyForm Noncommercial (se abre en una pestaña nueva)">PolyForm Noncommercial</a>
        </p>
      </div>
    </div>

  </div>
</footer>
