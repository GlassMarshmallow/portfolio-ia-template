<!-- Enlace para saltar directamente al contenido con el teclado -->
<a class="gm-skip-link" href="#main-content">Saltar al contenido</a>

<header class="gm-navbar gm-navbar--centered gm-navbar--floating site-header">
  <nav class="gm-navbar__nav" aria-label="Principal">
    @for (link of links; track link.href) {
      <a [href]="link.href">{{ link.label }}</a>
    }
  </nav>

  <div class="gm-navbar__actions">
    <!-- Cambiar entre modo oscuro y claro -->
    <button type="button" class="gm-icon-btn" (click)="toggleTheme()" [attr.aria-pressed]="lightTheme()"
            [attr.aria-label]="lightTheme() ? 'Activar modo oscuro' : 'Activar modo claro'">
      <i class="gmi" [class.gmi-moon]="lightTheme()" [class.gmi-sun]="!lightTheme()" aria-hidden="true"></i>
    </button>

    <!-- Menú a pantalla completa (solo en el móvil) -->
    <button #openButton type="button" class="gm-icon-btn gm-icon-btn--glass gm-navbar__menu" aria-label="Abrir menú"
            aria-controls="mobileMenu" [attr.aria-expanded]="menuOpen()" (click)="openMenu()">
      <i class="gmi gmi-list" aria-hidden="true"></i>
    </button>
  </div>
</header>

<!-- MENÚ A PANTALLA COMPLETA (móvil): cerrado no se puede alcanzar con el teclado -->
<div class="gm-fullscreen-menu" id="mobileMenu" role="dialog" aria-modal="true" aria-label="Menú"
     [class.is-open]="menuOpen()" [attr.inert]="menuOpen() ? null : ''">
  <button #closeButton type="button" class="gm-icon-btn gm-icon-btn--glass gm-fullscreen-menu__close"
          aria-label="Cerrar menú" (click)="closeMenu()"><i class="gmi gmi-x-lg" aria-hidden="true"></i></button>

  <nav aria-label="Menú móvil">
    <ul class="gm-fullscreen-menu__links">
      @for (link of mobileLinks; track link.href) {
        <li><a [href]="link.href" (click)="closeMenu(false)">{{ link.label }}</a></li>
      }
    </ul>
  </nav>
</div>
