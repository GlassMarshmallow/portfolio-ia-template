<!-- Decorativa: la lista completa de tecnologías está en la sección Habilidades -->
<div class="gm-ticker" [class.gm-ticker--static]="!moving()" [class.is-paused]="paused()" aria-hidden="true">
  <div class="gm-ticker__track">
    @for (copy of copies(); track copy) {
      @for (logo of logos; track logo) {
        <span class="gm-ticker__item"><i [class]="'gmi gmi-' + logo"></i>{{ titles[logo] }}</span>
      }
    }
  </div>
</div>
