<section id="home" class="hero" aria-label="Inicio">
  <!-- Descripción del dibujo animado de fondo (el dibujo está en el fondo de la página, src/app/core/data/hero.data.ts) -->
  @if (hasScene) {
    <span class="gm-visually-hidden" role="img" [attr.aria-label]="heroDescription"></span>
  }

  <!-- Contenido centrado -->
  <div class="content">
    @if (profile.photo) {
      <span class="gm-avatar gm-avatar--ring hero-photo"><img [src]="profile.photo" [alt]="'Foto de ' + profile.fullName" width="240" height="240"></span>
    }
    <h1 class="gm-text-outline">Hola, soy <span class="accent">{{ profile.firstName }}</span>,</h1>
    <p class="hero-subtitle gm-text-outline">{{ profile.role }}.</p>

    <!-- Redes (solo en ordenador: en el móvil están en «Conectemos», al final) -->
    <div class="gm-socials socials">
      <button type="button" aria-label="Copiar dirección de correo" (click)="copyEmail()">
        <i class="gmi gmi-envelope-fill" aria-hidden="true"></i>
      </button>
      <a [href]="githubUrl" aria-label="GitHub (se abre en una pestaña nueva)" target="_blank" rel="noopener">
        <i class="gmi gmi-github" aria-hidden="true"></i>
      </a>
      <a [href]="linkedinUrl" aria-label="LinkedIn (se abre en una pestaña nueva)" target="_blank" rel="noopener">
        <i class="gmi gmi-linkedin" aria-hidden="true"></i>
      </a>
    </div>

    <p class="copy-msg" role="status" [class.visible]="copied()">@if (copied()) { ¡Correo copiado! }</p>

    <!-- Preguntas sobre ti respondidas por IA, con bocadillos sobre la escena -->
    <app-hero-ask />
  </div>

  <!-- Pausa / reanuda las animaciones del inicio: la franja de logos y, si lo hay, el dibujo (WCAG 2.2.2) -->
  <button type="button" class="gm-btn gm-btn--secondary gm-btn--sm pause-btn" (click)="togglePause()" [attr.aria-pressed]="paused()">
    {{ paused() ? 'Reanudar animación' : 'Pausar animación' }}
  </button>

  <!-- Franja con los logos de las tecnologías, en la parte de abajo del inicio -->
  <app-skills-ticker class="hero-ticker" [paused]="paused()" />
</section>
