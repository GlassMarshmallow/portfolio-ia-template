<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Portfolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Modo claro/oscuro guardado por la visitante (por defecto, claro)
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'; }
    catch { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Degradado de las luces del dibujo (cian, violeta, ámbar) para pintar iconos SVG en modo claro -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="degradado-dibujo" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#0e7490" />
        <stop offset="0.5" stop-color="#5b3fd0" />
        <stop offset="1" stop-color="#b45309" />
      </linearGradient>
    </defs>
  </svg>
  <app-root></app-root>
</body>
</html>
