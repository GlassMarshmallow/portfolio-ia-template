<!doctype html>
<html lang="es" class="gm-accent-turquoise">
<head>
  <meta charset="utf-8">
  <title>Alex Ejemplo | Portfolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Buscadores y redes sociales: son los de la página de inicio (en cada página los actualiza SeoService).
       Cámbialos por tus datos y tu dominio (busca «tu-dominio.com» y «Alex Ejemplo»); el dominio también está en
       core/data/site.data.ts, robots.txt y sitemap.xml. La imagen al compartir el enlace es public/assets/og-image.jpg
       (1200 × 630 px). -->
  <meta name="description" content="Soy Alex Ejemplo, desarrollador full-stack. Pregunta a mi asistente con IA por mi trabajo o cuéntame tu proyecto.">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Alex Ejemplo">
  <link rel="canonical" href="https://tu-dominio.com/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_ES">
  <meta property="og:site_name" content="Alex Ejemplo">
  <meta property="og:title" content="Alex Ejemplo | Portfolio">
  <meta property="og:description" content="Soy Alex Ejemplo, desarrollador full-stack. Pregunta a mi asistente con IA por mi trabajo o cuéntame tu proyecto.">
  <meta property="og:url" content="https://tu-dominio.com/">
  <meta property="og:image" content="https://tu-dominio.com/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Portfolio de Alex Ejemplo con su foto y el chat con IA">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Alex Ejemplo | Portfolio">
  <meta name="twitter:description" content="Soy Alex Ejemplo, desarrollador full-stack. Pregunta a mi asistente con IA por mi trabajo o cuéntame tu proyecto.">
  <meta name="twitter:image" content="https://tu-dominio.com/assets/og-image.jpg">
  <!-- Quién eres, para Google (datos estructurados): nombre, profesión, web y perfiles -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Alex Ejemplo",
    "jobTitle": "Desarrollador full-stack",
    "url": "https://tu-dominio.com/",
    "image": "https://tu-dominio.com/assets/og-image.jpg",
    "knowsAbout": ["Angular", "TypeScript", ".NET", "Accesibilidad web"],
    "sameAs": ["https://www.linkedin.com/in/tu-usuario/", "https://github.com/tu-usuario"]
  }
  </script>
  <!-- Icono de la pestaña: el logo de GlassMarshmallow (cámbialo por el tuyo si quieres) -->
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/x-icon" sizes="32x32" href="favicon.ico">
  <script>
    // Modo claro/oscuro guardado por la visitante (por defecto, claro)
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'; }
    catch { document.documentElement.dataset.theme = 'light'; }
  </script>
  <!-- La letra Montserrat (src/styles-vendor/glassmarshmallow-font.min.css) se pide desde el principio: así llega antes
       que el primer dibujo de la página y el texto no cambia de letra ni se mueve al cargar. Angular la deja en media/
       con su nombre (outputHashing "bundles", en angular.json) -->
  <link rel="preload" href="media/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <app-root></app-root>
</body>
</html>
